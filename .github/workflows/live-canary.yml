name: Live API canary

# datasaudi-mcp queries the LIVE DataSaudi API. If that API changes shape or a
# cube behaves differently, the tool can break for users without any code change
# on our side. This canary runs the opt-in live smoke tests on a schedule and
# opens an issue if they fail — so we hear it from a bot, not an angry user.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write           # to open an issue on failure

jobs:
  live-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --python 3.12

      - name: Run LIVE smoke tests against api.datasaudi.sa
        id: live
        run: uv run pytest -m live -v

      - name: Open an issue if the live API broke the tool
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live API canary failed — DataSaudi may have changed";
            // Avoid duplicate issues: reuse an existing open canary issue if present.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "live-canary",
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled live smoke tests failed against the real DataSaudi API.",
              "",
              "This usually means the upstream API (api.datasaudi.sa) changed shape, a",
              "cube was renamed/removed, or the filter/measure contract shifted — which",
              "can silently break the tool for users even though our code is unchanged.",
              "",
              `Failed run: ${run}`,
              "",
              "What to check: which live test failed (Arabic round-trip, the silent-drop",
              "guard, cut filtering, member listing), then compare against docs/API_REFERENCE.md.",
            ].join("\n");
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Canary failed again.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["live-canary", "bug"],
              });
            }
