name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Project mode: uv creates an isolated venv (avoids the runner's PEP 668
      # externally-managed Python). --all-extras pulls in the [dev] deps.
      - name: Install the project (with dev deps)
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (offline suite — live tests are opt-in and not run in CI)
        run: uv run pytest -m "not live" -q
