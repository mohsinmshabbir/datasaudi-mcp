[project]
name = "datasaudi-mcp"
version = "0.1.1"
description = "MCP server for Saudi economic & social statistics (GASTAT / DataSaudi) — query GDP, inflation, trade, population in plain English or Arabic from Claude, Cursor, and other AI clients. Keyless, no database."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohsin Shabbir" }]
requires-python = ">=3.12"
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "claude", "cursor",
    "saudi-arabia", "gastat", "datasaudi", "statistics", "economics",
    "open-data", "arabic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=3.0",   # R19 uses the 3.x list_tools() async API
    "pydantic>=2.0",
    "httpx>=0.27",   # async HTTP to the DataSaudi Tesseract API (keyless, no WAF)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
datasaudi-mcp = "datasaudi_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mohsinmshabbir/datasaudi-mcp"
Repository = "https://github.com/mohsinmshabbir/datasaudi-mcp"
Issues = "https://github.com/mohsinmshabbir/datasaudi-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasaudi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real api.datasaudi.sa (opt-in; needs network)",
]
